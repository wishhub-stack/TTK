  /* ---------- экран ввода кода: только поле, прямо на фото ---------- */
  .code-entry{
    position:fixed;
    top:49%;
    left:44%;
    right:8%;
    transform: translateY(-50%);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .code-entry.hide{
    opacity:0;
    pointer-events:none;
    transform: translateY(-50%) translateY(-8px);
  }

  #codeInput{
    display:block;
    width:100%;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: clamp(1.15rem, 6.2vw, 1.55rem);
    letter-spacing:0.05em;
    text-align:center;
    text-transform:uppercase;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 2px solid rgba(36,26,20,0.38);
    padding: 6px 4px 10px;
    caret-color: var(--rose);
  }
  #codeInput::placeholder{ color: transparent; }
  #codeInput:focus{
    outline:none;
    border-bottom-color: var(--rose);
  }
  #codeInput.shake{
    animation: shake 0.4s;
    border-bottom-color: var(--rose);
  }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-8px); }
    40%{ transform: translateX(7px); }
    60%{ transform: translateX(-5px); }
    80%{ transform: translateX(4px); }
  }

  /* ---------- экран результата: карточка-записка снизу ---------- */
  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    display:flex;
    justify-content:center;
    transform: translateY(110%);
    visibility:hidden;
    transition: transform 0.5s ease, visibility 0s linear 0.5s;
    padding: 0 16px;
  }
  .sheet.show{
    transform: translateY(0);
    visibility:visible;
    transition: transform 0.5s ease;
  }

  .note{
    position:relative;
    width:100%;
    max-width: 440px;
    background: var(--paper);
    border-radius: 18px 18px 0 0;
    padding: 34px 26px 30px;
    box-shadow:
      0 -12px 40px rgba(20,10,8,0.35),
      0 0 0 1px var(--paper-edge);
  }

  .note::before{
    content:"";
    position:absolute; top:9px; left:9px; right:9px; bottom:9px;
    border: 1px solid rgba(36,26,20,0.12);
    pointer-events:none;
    border-radius: 12px 12px 0 0;
  }

  .tape{
    position:absolute;
    top:-16px;
    width: 74px; height:32px;
    opacity:0.9;
    box-shadow: 0 3px 8px rgba(0,0,0,0.18);
  }
  .tape.left{
    left: 26px;
    transform: rotate(-7deg);
    background: linear-gradient(180deg, rgba(231,200,119,0.85), rgba(199,154,58,0.75));
  }
  .tape.right{
    right: 26px;
    transform: rotate(6deg);
    background: linear-gradient(180deg, rgba(179,73,90,0.62), rgba(179,73,90,0.5));
  }

  .result{ display:flex; flex-direction:column; gap:16px; }

  .result h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.4rem;
    margin:0;
    color: var(--ink);
  }

  .result p{
    margin:0;
    line-height:1.55;
    color: var(--ink-soft);
    font-size:1rem;
  }

  .bonus{
    background: #fffdf8;
    border: 1.5px dashed var(--gold);
    border-radius: 10px;
    padding: 16px;
    text-align:center;
  }
  .bonus .label{
    font-size:0.8rem;
    color: var(--ink-soft);
    margin-bottom:6px;
  }
  .bonus .code{
    font-family:'Fraunces', serif;
    font-size:1.3rem;
    font-weight:600;
    letter-spacing:0.04em;
    color: var(--rose);
  }
  .bonus .terms{
    font-size:0.8rem;
    color: var(--ink-soft);
    margin-top:6px;
  }

  .video-btn{
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:1rem;
    padding: 14px 16px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    color: #2a1d05;
    cursor:pointer;
    margin-top: 4px;
  }

  .video-frame{
    display:none;
    margin-top: 14px;
  }
  .video-frame.show{ display:block; }
  .video-frame iframe{
    width:100%; aspect-ratio: 16/9;
    border:0; border-radius: 8px;
  }

  .final-note{
    display:none;
    background: rgba(179,73,90,0.08);
    border-left: 3px solid var(--rose);
    padding: 12px 14px;
    border-radius: 0 8px 8px 0;
    font-size:0.95rem;
    color: var(--ink);
    margin-top: 4px;
  }
  .final-note.show{ display:block; }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <div class="bg-photo"></div>

  <form id="codeForm" class="code-entry">
    <input type="text" id="codeInput" aria-label="Код с постера" autocomplete="off" autocapitalize="characters" spellcheck="false" />
  </form>

  <div class="sheet" id="resultSheet">
    <div class="note">
      <div class="tape left"></div>
      <div class="tape right"></div>

      <div class="result" id="result">
        <h2 id="resultTitle"></h2>
        <p id="resultBody"></p>

        <div class="bonus" id="bonusBlock" style="display:none;">
          <div class="label" id="bonusLabel"></div>
          <div class="code" id="bonusCode"></div>
          <div class="terms" id="bonusTerms"></div>
        </div>

        <button class="video-btn" id="videoBtn" style="display:none;">Смотреть видео</button>
        <div class="video-frame" id="videoFrame">
          <iframe id="videoIframe" src="" title="Видео" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <div class="final-note" id="finalNote"></div>
      </div>
    </div>
  </div>

<script>
/* ================================================================
   CONFIG — редактируй только это. Ничего ниже трогать не нужно.
   ================================================================ */
const CONFIG = {

  // Коды с трёх постеров. Регистр и пробелы не важны — сайт сам
  // приводит ввод к верхнему регистру и убирает пробелы по краям.
  // Замени на свои, когда решишь, что писать на постерах.
  codes: {
    stage1: "БЕЛЫЕНОЧИ",
    stage2: "МОСТРАЗВЕДЁН",
    stage3: "НЕВСКИЙ58"
  },

  stage1: {
    title: "Первый след найден",
    body: "Отлично. Вот координаты второго постера: [ЗАМЕНИ НА АДРЕС / КООРДИНАТЫ / ОПИСАНИЕ МЕСТА]."
  },

  stage2: {
    title: "Второй след — и подарок по пути",
    body: "Почти на месте. Координаты третьего постера: [ЗАМЕНИ НА АДРЕС / КООРДИНАТЫ / ОПИСАНИЕ МЕСТА].",
    bonus: {
      label: "Загляни в Золотое Яблоко и покажи это на кассе",
      code: "ЗАМЕНИ-НА-РЕАЛЬНЫЙ-КОД",
      terms: "[ЗАМЕНИ НА УСЛОВИЯ СЕРТИФИКАТА: срок действия, магазин, сумма]"
    }
  },

  stage3: {
    title: "Это был последний след",
    body: "Ты дошла до конца маршрута. Финальные координаты: [ЗАМЕНИ НА АДРЕС / КООРДИНАТЫ, КУДА ПРИЙТИ]",
    bonus: {
      label: "И ещё один подарок",
      code: "ЗАМЕНИ-НА-РЕАЛЬНЫЙ-КОД",
      terms: "[ЗАМЕНИ НА УСЛОВИЯ СЕРТИФИКАТА]"
    },
    // Необязательно: ссылка на НЕОПУБЛИКОВАННОЕ (unlisted) видео на YouTube.
    // Формат: https://www.youtube.com/embed/ВОТ_ЭТОТ_ID
    // Если видео не нужно — оставь пустую строку "" и кнопка не появится.
    videoEmbedUrl: "",
    finalNote: "[ЗАМЕНИ НА ФИНАЛЬНЫЙ ТЕКСТ: куда прийти и когда]"
  }
};
/* ================================================================ */

function normalize(str){
  return str.trim().toUpperCase().replace(/\s+/g, "");
}

function showResult({title, body, bonus, video, finalNote}){
  document.getElementById('codeForm').classList.add('hide');

  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultBody').textContent = body;

  const bonusBlock = document.getElementById('bonusBlock');
  if(bonus){
    bonusBlock.style.display = 'block';
    document.getElementById('bonusLabel').textContent = bonus.label;
    document.getElementById('bonusCode').textContent = bonus.code;
    document.getElementById('bonusTerms').textContent = bonus.terms;
  } else {
    bonusBlock.style.display = 'none';
  }

  const videoBtn = document.getElementById('videoBtn');
  if(video){
    videoBtn.style.display = 'inline-block';
    videoBtn.onclick = () => {
      document.getElementById('videoIframe').src = video;
      document.getElementById('videoFrame').classList.add('show');
      document.getElementById('finalNote').textContent = finalNote || '';
      document.getElementById('finalNote').classList.add('show');
      videoBtn.style.display = 'none';
    };
  } else {
    videoBtn.style.display = 'none';
    if(finalNote){
      document.getElementById('finalNote').textContent = finalNote;
      document.getElementById('finalNote').classList.add('show');
    }
  }

  document.getElementById('resultSheet').classList.add('show');
}

document.getElementById('codeForm').addEventListener('submit', function(e){
  e.preventDefault();
  const input = document.getElementById('codeInput');
  const val = normalize(input.value);

  if(val === normalize(CONFIG.codes.stage1)){
    showResult({ title: CONFIG.stage1.title, body: CONFIG.stage1.body });
  } else if(val === normalize(CONFIG.codes.stage2)){
    showResult({ title: CONFIG.stage2.title, body: CONFIG.stage2.body, bonus: CONFIG.stage2.bonus });
  } else if(val === normalize(CONFIG.codes.stage3)){
    showResult({
      title: CONFIG.stage3.title,
      body: CONFIG.stage3.body,
      bonus: CONFIG.stage3.bonus,
      video: CONFIG.stage3.videoEmbedUrl,
      finalNote: CONFIG.stage3.finalNote
    });
  } else {
    input.classList.add('shake');
    setTimeout(()=> input.classList.remove('shake'), 400);
  }
});
</script>
</body>
</html>
