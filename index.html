<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- скрытый спрайт: градиент + символ логотипа (данные пути подставляет script.js) -->
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="10%" style="stop-color:var(--gold-light)"></stop>
      <stop offset="75%" style="stop-color:var(--gold)"></stop>
    </linearGradient>
  </defs>
  <symbol id="afterdose-logo" viewBox="0 0 1200 906">
    <path id="afterdosePath" fill-rule="evenodd"></path>
  </symbol>
</svg>

<div id="splash" class="splash" aria-hidden="true">
  <div class="splash-logo-wrap" id="splashLogoWrap">
    <svg class="sig-svg" id="splashSvg" viewBox="0 0 1200 906" focusable="false">
      <g id="strokeLayer"></g>
    </svg>
    <svg class="logo-mark logo-mark--splash-fill" id="splashFillSvg" viewBox="0 0 1200 906" focusable="false">
      <use href="#afterdose-logo"></use>
    </svg>
  </div>
  <p class="splash-sub" id="splash-sub">???</p>
</div>

<div class="wrap" id="wrap">

  <header class="hero">
    <div class="hero-logo">
      <svg class="logo-mark logo-mark--header" viewBox="0 0 1200 906" focusable="false">
        <use href="#afterdose-logo"></use>
      </svg>
    </div>
    <p class="hero-tagline" id="hero-tagline">???</p>
    <p class="subtitle">Три места. Три кода. И то, что ждёт в конце.</p>
  </header>

  <div class="progress" id="progress" aria-hidden="true">
    <div class="progress-step" data-step="1"><span>1</span></div>
    <div class="progress-line"></div>
    <div class="progress-step" data-step="2"><span>2</span></div>
    <div class="progress-line"></div>
    <div class="progress-step" data-step="3"><span>3</span></div>
  </div>

  <main id="app" class="card">
    <!-- контент подставляется скриптом -->
  </main>

  <footer class="signature">
    <p>для тебя</p>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
